[workspace]
members = [".", "test-proto"]

[package]
edition = "2024"
name = "cobs-proto"
version = "0.1.0"
publish = false

[features]
defmt = ["dep:defmt"]

[dependencies]
cobs = { version = "0.5.0", default-features = false }
crc = { version = "3.4", default-features = false }
micropb = { version = "0.6.0", default-features = false, features = ["encode", "decode"] }
embedded-io-async = { version = "0.7.0" }

# run-only dependencies
defmt = { version = "1.0.1", optional = true }

[dev-dependencies]
embassy-futures = "0.1"
heapless = "0.9"
test-proto = { path = "test-proto" }
