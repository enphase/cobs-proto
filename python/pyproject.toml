[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cobs-proto"
description = "Shared COBS+CRC framed protobuf transport for asyncio serial protocols"
version = "0.1.0"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Richard Lin", email = "richardlin@enphaseenergy.com" }
]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "protobuf~=7.0",
    "cobs",
    "mypy",
]

[project.urls]
Homepage = "https://github.com/enphase/cobs-proto"
Issues = "https://github.com/enphase/cobs-proto/issues"


[project.optional-dependencies]
dev = [
    "black~=26.0",
    "pytest~=9.0",
    "pytest-asyncio~=1.0",
    "types-protobuf~=7.0",
]

[tool.mypy]
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
strict = true

[[tool.mypy.overrides]]
module = ["cobs.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.proto.*"]
ignore_errors = true
