name: Python

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Python subdir
      run: cd python
    - name: Formatting
      run: black --check .
    - name: Run tests
      run: pytest
