name: Python

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python

    steps:
    - uses: actions/checkout@v6
    - name: Install deps
      run: pip install -e .[dev]
    - name: Formatting
      run: black --check .
    - name: Type checking
      run: mypy .
    - name: Run tests
      run: pytest
